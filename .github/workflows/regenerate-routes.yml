name: Regenerate TanStack routes

on:
  push:
    branches: [fix/security-and-ai-ops-audit]

permissions:
  contents: write

jobs:
  routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Regenerate generated routes
        run: bun run build:dev
      - name: Commit generated route changes
        run: |
          if git diff --quiet -- src/routes; then
            echo "Generated routes are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes
          git commit -m "chore(router): regenerate MCP routes for SDK 3"
          git push origin "HEAD:${GITHUB_REF_NAME}"
