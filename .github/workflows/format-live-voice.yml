name: Format live voice feature

on:
  push:
    branches: [feat/ella-live-voice-mode]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format changed files
        run: bunx prettier --write src/components/EllaVoiceMode.tsx src/lib/aiChat.functions.ts src/routes/_authenticated/ia.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EllaVoiceMode.tsx src/lib/aiChat.functions.ts src/routes/_authenticated/ia.tsx
          git commit -m "style(voice): format live voice implementation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
