name: Deploy Desabafo Amigo to Cloudflare Workers

# This project is published on Lovable hosting. Keep Cloudflare deployment manual
# until the required Cloudflare and runtime secrets are configured in GitHub.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desabafo-amigo-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --no-progress

      - name: Build application
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload runtime secrets to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_VOICE: ${{ secrets.NVIDIA_API_KEY_VOICE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NVIDIA_ASR_HTTP_URL: ${{ secrets.NVIDIA_ASR_HTTP_URL }}
          NVIDIA_API_KEY_ASR: ${{ secrets.NVIDIA_API_KEY_ASR }}
          NVIDIA_ASR_FUNCTION_ID: ${{ secrets.NVIDIA_ASR_FUNCTION_ID }}
          NVIDIA_ASR_LANGUAGE: ${{ vars.NVIDIA_ASR_LANGUAGE }}
          NVIDIA_TTS_VOICE: ${{ vars.NVIDIA_TTS_VOICE }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
        run: |
          set -euo pipefail
          put_required_secret() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
            printf '%s' "$value" | bunx wrangler secret put "$name" --name desabafo-amigo
          }
          put_optional_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | bunx wrangler secret put "$name" --name desabafo-amigo
            fi
          }
          put_required_secret NVIDIA_API_KEY "$NVIDIA_API_KEY"
          # Voice can reuse the main NVIDIA credential when no separate key is configured.
          put_required_secret NVIDIA_API_KEY_VOICE "${NVIDIA_API_KEY_VOICE:-$NVIDIA_API_KEY}"
          put_required_secret SUPABASE_URL "$SUPABASE_URL"
          put_required_secret SUPABASE_PUBLISHABLE_KEY "$SUPABASE_PUBLISHABLE_KEY"
          put_optional_secret SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          put_optional_secret NVIDIA_ASR_HTTP_URL "$NVIDIA_ASR_HTTP_URL"
          put_optional_secret NVIDIA_API_KEY_ASR "$NVIDIA_API_KEY_ASR"
          put_optional_secret NVIDIA_ASR_FUNCTION_ID "$NVIDIA_ASR_FUNCTION_ID"
          put_optional_secret NVIDIA_ASR_LANGUAGE "$NVIDIA_ASR_LANGUAGE"
          put_optional_secret NVIDIA_TTS_VOICE "$NVIDIA_TTS_VOICE"
          put_optional_secret VAPID_PUBLIC_KEY "$VAPID_PUBLIC_KEY"
          put_optional_secret VAPID_PRIVATE_KEY "$VAPID_PRIVATE_KEY"
          put_optional_secret VAPID_SUBJECT "$VAPID_SUBJECT"

      - name: Deploy Worker
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
