name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev:
    name: Lint, test and build (development)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare log dir
        run: mkdir -p build-logs
      - name: Lint changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -o pipefail
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD~1)"
          fi
          FILES="$(git diff --name-only "$BASE_SHA"...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx')"
          if [ -n "$FILES" ]; then
            bunx eslint $FILES 2>&1 | tee build-logs/lint.log
          else
            echo "Nenhum arquivo de código alterado para lint." | tee build-logs/lint.log
          fi
      - name: Test
        run: |
          set -o pipefail
          bun run test 2>&1 | tee build-logs/test.log
      - name: Build (development)
        run: |
          set -o pipefail
          bun run build:dev 2>&1 | tee build-logs/build-dev.log
      - name: Upload dev build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-dev-logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload dev dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-dev-dist
          path: dist/
          if-no-files-found: ignore
          retention-days: 14

  build-prod:
    name: Build (production)
    runs-on: ubuntu-latest
    needs: build-dev
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare log dir
        run: mkdir -p build-logs
      - name: Build (production)
        run: |
          set -o pipefail
          bun run build:prod 2>&1 | tee build-logs/build-prod.log
      - name: Upload prod build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-prod-logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload prod dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-prod-dist
          path: dist/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Auto GitHub Release
    runs-on: ubuntu-latest
    needs: build-prod
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download prod dist
        uses: actions/download-artifact@v4
        with:
          name: build-prod-dist
          path: dist
      - name: Verify dist/
        run: |
          if [ ! -d dist ] || [ -z "$(ls -A dist)" ]; then
            echo "::error::dist/ vazio — build:prod não produziu artefatos, abortando release."
            exit 1
          fi
      - name: Compute release tag
        id: tag
        run: |
          DATE=$(date -u +'%Y.%m.%d')
          SHORT=${GITHUB_SHA::7}
          BASE="v${DATE}"
          TAG="${BASE}-${SHORT}"
          N=1
          while git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; do
            TAG="${BASE}-${SHORT}-${N}"
            N=$((N+1))
          done
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          PREV=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)
          {
            echo "## Build automático de produção"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Workflow run: [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo ""
            echo "### Alterações desde o último release"
            echo ""
            if [ -n "$PREV" ] && git rev-parse "refs/tags/${PREV}" >/dev/null 2>&1; then
              git log "${PREV}..HEAD" --pretty=format:'- %s (%h) — %an' --no-merges
              echo ""
              echo ""
              echo "**Diff completo:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV}...${RELEASE_TAG}"
            else
              echo "_Primeiro release automático — exibindo os últimos 50 commits._"
              echo ""
              git log -n 50 --pretty=format:'- %s (%h) — %an' --no-merges
            fi
          } > RELEASE_NOTES.md
      - name: Package dist/
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          mkdir -p release-assets
          zip -qr "release-assets/desabafa-amigo-${TAG}-dist.zip" dist
          tar -czf "release-assets/desabafa-amigo-${TAG}-dist.tar.gz" dist
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ github.run_id }}"
          gh release create "$TAG" release-assets/* --title "Desabafo Amigo ${TAG}" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA"
