name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev:
    name: Build (development)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint 2>&1 | tee -a build-logs/lint.log
        continue-on-error: true
      - name: Test
        run: bun run test 2>&1 | tee -a build-logs/test.log
        continue-on-error: true
      - name: Prepare log dir
        run: mkdir -p build-logs
      - name: Build (development)
        id: build_dev
        run: |
          set -o pipefail
          bun run build:dev 2>&1 | tee build-logs/build-dev.log
      - name: Upload dev build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-dev-logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload dev dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-dev-dist
          path: dist/
          if-no-files-found: ignore
          retention-days: 14

  build-prod:
    name: Build (production)
    runs-on: ubuntu-latest
    needs: build-dev
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare log dir
        run: mkdir -p build-logs
      - name: Build (production)
        id: build_prod
        run: |
          set -o pipefail
          bun run build:prod 2>&1 | tee build-logs/build-prod.log
      - name: Upload prod build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-prod-logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload prod dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-prod-dist
          path: dist/
          if-no-files-found: ignore
          retention-days: 14
