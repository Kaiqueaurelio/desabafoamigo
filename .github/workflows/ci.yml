name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev:
    name: Build (development)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint 2>&1 | tee -a build-logs/lint.log
        continue-on-error: true
      - name: Test
        run: bun run test 2>&1 | tee -a build-logs/test.log
        continue-on-error: true
      - name: Prepare log dir
        run: mkdir -p build-logs
      - name: Build (development)
        id: build_dev
        run: |
          set -o pipefail
          bun run build:dev 2>&1 | tee build-logs/build-dev.log
      - name: Upload dev build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-dev-logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload dev dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-dev-dist
          path: dist/
          if-no-files-found: ignore
          retention-days: 14

  build-prod:
    name: Build (production)
    runs-on: ubuntu-latest
    needs: build-dev
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare log dir
        run: mkdir -p build-logs
      - name: Build (production)
        id: build_prod
        run: |
          set -o pipefail
          bun run build:prod 2>&1 | tee build-logs/build-prod.log
      - name: Upload prod build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-prod-logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload prod dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-prod-dist
          path: dist/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Auto GitHub Release
    runs-on: ubuntu-latest
    needs: build-prod
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download prod dist
        uses: actions/download-artifact@v4
        with:
          name: build-prod-dist
          path: dist

      - name: Verify dist/
        run: |
          if [ ! -d dist ] || [ -z "$(ls -A dist)" ]; then
            echo "::error::dist/ vazio — build:prod não produziu artefatos, abortando release."
            exit 1
          fi

      - name: Compute release tag
        id: tag
        run: |
          DATE=$(date -u +'%Y.%m.%d')
          SHORT=${GITHUB_SHA::7}
          BASE="v${DATE}"
          TAG="${BASE}-${SHORT}"
          # Se por algum motivo já existir, adiciona sufixo -N
          N=1
          while git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; do
            TAG="${BASE}-${SHORT}-${N}"
            N=$((N+1))
          done
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)
          {
            echo "## Build automático de produção"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Workflow run: [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo ""
            echo "### Alterações desde o último release"
            echo ""
            if [ -n "$PREV" ] && git rev-parse "refs/tags/${PREV}" >/dev/null 2>&1; then
              git log "${PREV}..HEAD" --pretty=format:'- %s (%h) — %an' --no-merges
              echo ""
              echo ""
              echo "**Diff completo:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV}...${{ steps.tag.outputs.value }}"
            else
              echo "_Primeiro release automático — exibindo os últimos 50 commits._"
              echo ""
              git log -n 50 --pretty=format:'- %s (%h) — %an' --no-merges
            fi
          } > RELEASE_NOTES.md
          echo "path=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Package dist/
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          mkdir -p release-assets
          zip -qr "release-assets/desabafa-amigo-${TAG}-dist.zip" dist
          tar -czf "release-assets/desabafa-amigo-${TAG}-dist.tar.gz" dist
          (cd release-assets && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          gh release create "$TAG" release-assets/* \
            --title "Desabafa Amigo ${TAG}" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA"

