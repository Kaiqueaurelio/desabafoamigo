name: Format security audit branch

on:
  push:
    branches: [fix/security-and-ai-ops-audit]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format changed TypeScript files
        run: |
          bunx prettier --write \
            src/components/AdminSidebar.tsx \
            src/lib/__tests__/csrf-middleware.test.ts \
            src/lib/aiChat.functions.ts \
            src/lib/csrf-middleware.ts \
            src/lib/mcp/index.ts \
            src/lib/pending-database-types.ts \
            src/lib/queue.functions.ts \
            src/routes/__root.tsx \
            src/routes/_authenticated/ia.tsx \
            src/routes/admin.respostas-ia.tsx \
            src/start.ts \
            vitest.config.ts
      - name: Commit formatting if changed
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git add vitest.config.ts
          git commit -m "style: format security audit changes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
